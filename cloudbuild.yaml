# T&TG Trade Corporation — Google Cloud Build CI/CD
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/tntg-corp:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tntg-corp:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tntg-corp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'DJANGO_SETTINGS_MODULE=tntg_corp.settings_gcloud'

images:
  - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tntg-corp:latest'
