# T&TG Trade Corporation — Google Cloud Build CI/CD
# Auto-deploys to Cloud Run on every push to main branch
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tntg-corp:latest'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'

  # Step 3: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tntg-corp:latest'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tntg-corp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'DJANGO_SETTINGS_MODULE=tntg_corp.settings_gcloud'

images:
  - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tntg-corp:latest'
