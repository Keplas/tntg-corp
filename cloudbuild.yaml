# T&TG Trade Corporation — Google Cloud Build CI/CD
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/tntg-corp:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tntg-corp:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tntg-corp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'DJANGO_SETTINGS_MODULE=tntg_corp.settings_gcloud'

  # Prune old images — keep only the 3 most recent COMMIT_SHA tags.
  # 'latest' is always overwritten in place so it doesn't accumulate.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        IMAGE="gcr.io/$PROJECT_ID/tntg-corp"
        # List all digest+tags sorted newest-first; skip 'latest' and the 3 most recent SHAs
        gcloud container images list-tags $$IMAGE \
          --filter="-tags:latest" \
          --sort-by="~timestamp" \
          --format="get(digest)" \
          | tail -n +4 \
          | xargs -I{} gcloud container images delete "$$IMAGE@{}" --quiet --force-delete-tags || true

images:
  - 'gcr.io/$PROJECT_ID/tntg-corp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tntg-corp:latest'
