{% extends 'auth_base.html' %}
{% block title %}Password Updated | T&TG{% endblock %}
{% block auth_content %}
<div style="text-align:center;padding:12px 0">
  <div style="width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.12);border:2px solid rgba(34,197,94,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
    <i class="fas fa-check-circle" style="font-size:1.8rem;color:#4ade80"></i>
  </div>
  <h2 style="color:#fff;font-weight:900;margin-bottom:10px">Password Updated</h2>
  <p style="color:#7a6e5f;margin-bottom:28px;font-size:.87rem">Your password has been changed. You can now sign in with your new password.</p>
  <a href="{% url 'account_login' %}" class="auth-btn" style="display:block;text-align:center;text-decoration:none;padding:13px"><i class="fas fa-sign-in-alt me-2"></i>Sign In</a>
</div>
{% endblock %}
