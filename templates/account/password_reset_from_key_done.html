{% extends 'allauth/layouts/base.html' %}
{% block allauth_content %}
<div style="text-align:center">
  <i class="fas fa-check-circle" style="font-size:2.5rem;color:#4ade80;margin-bottom:16px"></i>
  <h3 style="color:#fff;font-weight:900;margin-bottom:10px">Password Updated</h3>
  <p style="color:#b0a898;margin-bottom:24px">Your password has been changed successfully. You can now sign in with your new password.</p>
  <a href="{% url 'account_login' %}" class="btn btn-gold px-5 py-3" style="font-weight:700">
    <i class="fas fa-sign-in-alt me-2"></i>Sign In
  </a>
</div>
{% endblock %}
