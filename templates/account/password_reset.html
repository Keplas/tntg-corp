{% extends 'auth_base.html' %}
{% block title %}Reset Password | T&TG Trade Corporation{% endblock %}
{% block auth_content %}
<div class="auth-title">
  <h2>Reset Your Password</h2>
  <p>Enter your email address and we will send you a link to reset your password.</p>
</div>
<form method="post" action="{% url 'account_reset_password' %}">
  {% csrf_token %}
  <div class="auth-field">
    <label class="ai-label">Email Address</label>
    <div class="input-group">
      <span class="ai-pre"><i class="fas fa-envelope fa-sm"></i></span>
      <input type="email" name="email" class="form-control ai ai-joined" placeholder="your@email.com" required autofocus>
    </div>
  </div>
  <button type="submit" class="auth-btn"><i class="fas fa-paper-plane me-2"></i>Send Reset Link</button>
</form>
<div style="text-align:center;margin-top:20px">
  <a href="{% url 'account_login' %}" class="auth-link" style="font-size:.84rem"><i class="fas fa-arrow-left me-1"></i>Back to Sign In</a>
</div>
{% endblock %}
