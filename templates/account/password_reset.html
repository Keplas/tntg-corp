{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password | T&TG Trade Corporation{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;background:linear-gradient(135deg,#060f1e,#0a1a35);padding:48px 0">
<div class="container">
<div class="row justify-content-center">
<div class="col-md-6 col-lg-5">
  <div style="text-align:center;margin-bottom:28px">
    <img src="{% static 'images/logo.jpg' %}" alt="T&TG" style="width:64px;height:64px;border-radius:14px;object-fit:cover;border:2px solid rgba(201,168,76,.3);margin-bottom:14px">
    <h2 style="color:#fff;font-weight:900;margin-bottom:6px">Reset Your Password</h2>
    <p style="color:#7a6e5f;font-size:.85rem">Enter your email and we will send a reset link</p>
  </div>
  <div style="background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.15);border-radius:20px;padding:36px">
    <form method="post" action="{% url 'account_reset_password' %}">
      {% csrf_token %}
      <label style="color:#b0a898;font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">Email Address</label>
      <div class="input-group mb-4">
        <span style="background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);border-right:none;color:#c9a84c;padding:0 14px;display:flex;align-items:center;border-radius:10px 0 0 10px"><i class="fas fa-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required
               style="background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);border-left:none;color:#fff;border-radius:0 10px 10px 0;padding:11px 14px">
      </div>
      <button type="submit" class="btn btn-gold w-100 py-3" style="font-weight:800">
        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
      </button>
    </form>
    <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)">
      <a href="{% url 'account_login' %}" style="color:#c9a84c;font-size:.85rem;text-decoration:none"><i class="fas fa-arrow-left me-1"></i>Back to Sign In</a>
    </div>
  </div>
</div>
</div>
</div>
</div>
{% endblock %}
