{% extends 'auth_base.html' %}
{% block title %}Reset Password | T&TG{% endblock %}
{% block auth_content %}
<h2 style="color:#fff;font-weight:900;font-size:1.5rem;margin-bottom:6px">Reset Password</h2>
<p style="color:#7a6e5f;font-size:.85rem;margin-bottom:24px">Enter your email and we will send a reset link.</p>
<form method="post" action="{% url 'account_reset_password' %}">{% csrf_token %}
  <div class="au-field"><label class="au-lbl">Email Address</label>
    <div class="input-group"><span class="au-pre"><i class="fas fa-envelope fa-sm"></i></span>
    <input type="email" name="email" class="form-control au-input au-joined" placeholder="your@email.com" required autofocus></div></div>
  <button type="submit" class="au-btn"><i class="fas fa-paper-plane me-2"></i>Send Reset Link</button>
</form>
<div style="text-align:center;margin-top:20px"><a href="{% url 'account_login' %}" style="color:#c9a84c;font-size:.84rem;text-decoration:none"><i class="fas fa-arrow-left me-1"></i>Back to Sign In</a></div>
{% endblock %}
