{% extends 'allauth/layouts/base.html' %}
{% block allauth_content %}
<h3 style="color:#fff;font-weight:900;margin-bottom:20px">Change Password</h3>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label style="color:#b0a898;font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">Current Password</label>
    <input type="password" name="oldpassword" class="form-control" style="background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);color:#fff;border-radius:10px;padding:10px 14px" required>
  </div>
  <div class="mb-3">
    <label style="color:#b0a898;font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">New Password</label>
    <input type="password" name="password1" class="form-control" style="background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);color:#fff;border-radius:10px;padding:10px 14px" required>
  </div>
  <div class="mb-4">
    <label style="color:#b0a898;font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">Confirm New Password</label>
    <input type="password" name="password2" class="form-control" style="background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);color:#fff;border-radius:10px;padding:10px 14px" required>
  </div>
  <button type="submit" class="btn btn-gold w-100 py-3" style="font-weight:800">
    <i class="fas fa-key me-2"></i>Update Password
  </button>
</form>
{% endblock %}
