{% extends 'auth_base.html' %}
{% block title %}Change Password | T&TG{% endblock %}
{% block auth_content %}
<div class="auth-title">
  <h2>Change Password</h2>
  <p>Update your T&TG account password.</p>
</div>
<form method="post">
  {% csrf_token %}
  <div class="auth-field">
    <label class="ai-label">Current Password</label>
    <div class="input-group">
      <span class="ai-pre"><i class="fas fa-lock fa-sm"></i></span>
      <input type="password" name="oldpassword" id="pw-old" class="form-control ai" style="border-radius:0!important;border-right:none!important;border-left:none!important" placeholder="Current password" required>
      <span class="ai-suf" onclick="togglePw('pw-old')" data-pw="pw-old"><i class="fas fa-eye"></i></span>
    </div>
  </div>
  <div class="auth-field">
    <label class="ai-label">New Password</label>
    <div class="input-group">
      <span class="ai-pre"><i class="fas fa-key fa-sm"></i></span>
      <input type="password" name="password1" id="pw-n1" class="form-control ai" style="border-radius:0!important;border-right:none!important;border-left:none!important" placeholder="New password" required oninput="checkPwStrength(this.value)">
      <span class="ai-suf" onclick="togglePw('pw-n1')" data-pw="pw-n1"><i class="fas fa-eye"></i></span>
    </div>
    <div class="pw-bar"><div class="pw-fill" id="pw-fill"></div></div>
    <div style="font-size:.72rem" id="pw-txt"></div>
  </div>
  <div class="auth-field">
    <label class="ai-label">Confirm New Password</label>
    <div class="input-group">
      <span class="ai-pre"><i class="fas fa-key fa-sm"></i></span>
      <input type="password" name="password2" id="pw-n2" class="form-control ai" style="border-radius:0!important;border-right:none!important;border-left:none!important" placeholder="Repeat new password" required>
      <span class="ai-suf" onclick="togglePw('pw-n2')" data-pw="pw-n2"><i class="fas fa-eye"></i></span>
    </div>
  </div>
  <button type="submit" class="auth-btn"><i class="fas fa-key me-2"></i>Update Password</button>
</form>
{% endblock %}
