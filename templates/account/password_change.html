{% extends 'auth_base.html' %}
{% block title %}Change Password | T&TG{% endblock %}
{% block auth_content %}
<h2 style="color:#fff;font-weight:900;font-size:1.5rem;margin-bottom:6px">Change Password</h2>
<p style="color:#7a6e5f;font-size:.85rem;margin-bottom:24px">Update your T&TG account password.</p>
<form method="post">{% csrf_token %}
  <div class="au-field"><label class="au-lbl">Current Password</label>
    <div class="input-group"><span class="au-pre"><i class="fas fa-lock fa-sm"></i></span>
    <input type="password" name="oldpassword" id="pw-co" class="form-control au-input" style="border-radius:0!important;border-right:none!important;border-left:none!important" placeholder="Current password" required>
    <span class="au-suf" onclick="auTogglePw('pw-co')" data-pw="pw-co"><i class="fas fa-eye"></i></span></div></div>
  <div class="au-field"><label class="au-lbl">New Password</label>
    <div class="input-group"><span class="au-pre"><i class="fas fa-key fa-sm"></i></span>
    <input type="password" name="password1" id="pw-cn" class="form-control au-input" style="border-radius:0!important;border-right:none!important;border-left:none!important" placeholder="New password" required oninput="auPwStrength(this.value)">
    <span class="au-suf" onclick="auTogglePw('pw-cn')" data-pw="pw-cn"><i class="fas fa-eye"></i></span></div>
    <div class="pw-bar"><div class="pw-fill" id="au-pw-fill"></div></div><div style="font-size:.72rem" id="au-pw-txt"></div></div>
  <div class="au-field"><label class="au-lbl">Confirm New Password</label>
    <div class="input-group"><span class="au-pre"><i class="fas fa-key fa-sm"></i></span>
    <input type="password" name="password2" id="pw-cn2" class="form-control au-input" style="border-radius:0!important;border-right:none!important;border-left:none!important" placeholder="Repeat new password" required>
    <span class="au-suf" onclick="auTogglePw('pw-cn2')" data-pw="pw-cn2"><i class="fas fa-eye"></i></span></div></div>
  <button type="submit" class="au-btn"><i class="fas fa-key me-2"></i>Update Password</button>
</form>{% endblock %}
