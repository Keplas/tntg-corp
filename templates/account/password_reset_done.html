{% extends 'allauth/layouts/base.html' %}
{% block allauth_content %}
<div style="text-align:center">
  <i class="fas fa-envelope-open" style="font-size:2.5rem;color:#4ade80;margin-bottom:16px"></i>
  <h3 style="color:#fff;font-weight:900;margin-bottom:10px">Reset Link Sent</h3>
  <p style="color:#b0a898;line-height:1.8;margin-bottom:24px">
    A password reset link has been sent to your email address. Check your inbox and spam folder.
  </p>
  <a href="{% url 'account_login' %}" class="btn btn-gold px-5 py-3" style="font-weight:700">Back to Sign In</a>
</div>
{% endblock %}
