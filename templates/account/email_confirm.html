{% extends 'auth_base.html' %}
{% block title %}Confirm Email | T&TG{% endblock %}
{% block auth_content %}
<div style="text-align:center;padding:16px 0">
  <div style="width:70px;height:70px;border-radius:50%;background:rgba(201,168,76,.1);border:2px solid rgba(201,168,76,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px"><i class="fas fa-envelope-open-text" style="font-size:1.8rem;color:#c9a84c"></i></div>
  <h2 style="color:#fff;font-weight:900;margin-bottom:8px">Confirm Email Address</h2>
  <p style="color:#7a6e5f;margin-bottom:24px;font-size:.87rem;line-height:1.8">Click below to verify your email and activate your T&TG account.</p>
  {% if confirmation %}<form method="post" action="{% url 'account_confirm_email' confirmation.key %}">{% csrf_token %}
    <button type="submit" class="au-btn"><i class="fas fa-check me-2"></i>Confirm Email Address</button>
  </form>{% endif %}
  <div style="margin-top:20px"><a href="{% url 'account_login' %}" style="color:#7a6e5f;font-size:.82rem;text-decoration:none">Back to Sign In</a></div>
</div>{% endblock %}
