{% extends 'allauth/layouts/base.html' %}
{% block allauth_content %}
<h3 style="color:#fff;font-weight:900;margin-bottom:20px">Set New Password</h3>
{% if token_fail %}
<div style="text-align:center">
  <i class="fas fa-times-circle" style="font-size:2.5rem;color:#f87171;margin-bottom:16px"></i>
  <p style="color:#b0a898;margin-bottom:20px">This password reset link is invalid or has expired.</p>
  <a href="{% url 'account_reset_password' %}" class="btn btn-gold px-5 py-3" style="font-weight:700">Request New Link</a>
</div>
{% else %}
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label style="color:#b0a898;font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">New Password</label>
    <input type="password" name="password1" class="form-control" style="background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);color:#fff;border-radius:10px;padding:10px 14px" required>
  </div>
  <div class="mb-4">
    <label style="color:#b0a898;font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">Confirm Password</label>
    <input type="password" name="password2" class="form-control" style="background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);color:#fff;border-radius:10px;padding:10px 14px" required>
  </div>
  <button type="submit" class="btn btn-gold w-100 py-3" style="font-weight:800">
    <i class="fas fa-lock me-2"></i>Set New Password
  </button>
</form>
{% endif %}
{% endblock %}
