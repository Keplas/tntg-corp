{% extends 'base.html' %}
{% load static %}
{% block content %}
<div style="min-height:80vh;background:linear-gradient(135deg,#060f1e 0%,#0a1a35 100%);padding:56px 0;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(201,168,76,.06),transparent 60%);pointer-events:none"></div>
  <div class="container" style="position:relative;z-index:1">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div style="text-align:center;margin-bottom:28px">
          <img src="{% static 'images/logo.jpg' %}" alt="T&TG" style="width:64px;height:64px;border-radius:14px;object-fit:cover;border:2px solid rgba(201,168,76,.3);margin-bottom:14px">
          <h2 style="color:#fff;font-weight:900;margin-bottom:6px">T&TG Trade Corporation</h2>
        </div>
        <div style="background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.15);border-radius:22px;padding:36px">
          {% block allauth_content %}{% endblock %}
        </div>
        <div style="text-align:center;margin-top:20px">
          <a href="/" style="color:#7a6e5f;font-size:.82rem;text-decoration:none"><i class="fas fa-arrow-left me-1"></i>Back to Homepage</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
