{% extends 'auth_base.html' %}
{% block title %}Authentication Error | T&TG{% endblock %}
{% block auth_content %}
<div style="text-align:center;padding:16px 0">
  <div style="width:70px;height:70px;border-radius:50%;background:rgba(239,68,68,.1);border:2px solid rgba(239,68,68,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px"><i class="fas fa-exclamation-triangle" style="font-size:1.8rem;color:#f87171"></i></div>
  <h2 style="color:#fff;font-weight:900;margin-bottom:8px">Authentication Error</h2>
  <p style="color:#7a6e5f;margin-bottom:28px;font-size:.87rem;line-height:1.8">An error occurred during social sign-in. Please try again or sign in with email and password.</p>
  <a href="{% url 'account_login' %}" class="au-btn" style="display:block;text-align:center;text-decoration:none;padding:13px">Back to Sign In</a>
</div>{% endblock %}
