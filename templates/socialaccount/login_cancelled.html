{% extends 'allauth/layouts/base.html' %}
{% block allauth_content %}
<div style="text-align:center">
  <i class="fas fa-times-circle" style="font-size:2.5rem;color:#fb923c;margin-bottom:16px"></i>
  <h3 style="color:#fff;font-weight:900;margin-bottom:12px">Login Cancelled</h3>
  <p style="color:#b0a898;margin-bottom:24px">You cancelled the login process. You can try again whenever you are ready.</p>
  <a href="{% url 'account_login' %}" class="btn btn-gold px-5 py-3" style="font-weight:700">Back to Sign In</a>
</div>
{% endblock %}
