{% extends 'base.html' %}
{% load static %}
{% block title %}Pay with Moneris | T&TG Trade Corp{% endblock %}

{% block content %}
<div style="min-height:100vh;background:linear-gradient(135deg,var(--bg-dark),var(--bg-card));padding:3rem 0">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="text-center mb-4">
        <img src="{% static 'images/logo.jpg' %}" alt="T&TG Logo"
             style="width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 4px 20px rgba(201,168,76,.3);margin-bottom:.5rem">
        <h2 class="text-gold mb-1">Secure Payment</h2>
        <p class="text-muted" style="font-size:.875rem">Order #{{ order.pk }} &mdash; {{ order.product.name }}</p>
      </div>

      <!-- Moneris checkout renders inside this div -->
      <div class="glass-card p-3" style="border-radius:16px;min-height:200px">
        <div id="monerisCheckout"></div>
        <div id="moneris-loading" class="text-center py-5">
          <i class="fas fa-spinner fa-spin fa-2x text-gold"></i>
          <p class="text-muted mt-3" style="font-size:.875rem">Loading secure payment form&hellip;</p>
        </div>
      </div>

      <div class="text-center mt-3">
        <a href="{% url 'payment_select' order.pk %}" style="color:rgba(255,255,255,.4);font-size:.8rem;text-decoration:none">
          <i class="fas fa-arrow-left me-1"></i> Cancel and go back
        </a>
      </div>

    </div>
  </div>
</div>
</div>

<!-- Moneris Checkout v2 JS (must load from Moneris's own server) -->
<script>
  function onMonerisLoadError() {
    document.getElementById('moneris-loading').innerHTML =
      '<i class="fas fa-exclamation-triangle fa-2x" style="color:#e74c3c"></i>' +
      '<p class="mt-3" style="color:#e74c3c;font-size:.9rem">Failed to load the payment form. Please check your internet connection and try again.</p>' +
      '<a href="{% url 'payment_select' order.pk %}" class="btn btn-gold mt-2">Go Back</a>';
  }
</script>
<script src="{{ js_url }}" onerror="onMonerisLoadError()"></script>
<script>
(function () {
  if (typeof monerisCheckout === 'undefined') {
    onMonerisLoadError();
    return;
  }

  var ticket    = "{{ ticket }}";
  var env       = "{{ moneris_env }}";  // 'prod' or 'qa'
  var verifyUrl = "{% url 'moneris_verify' order.pk %}";
  var csrfToken = "{{ csrf_token }}";

  var myCheckout = new monerisCheckout();
  myCheckout.setMode(env);
  myCheckout.setCheckoutDiv('monerisCheckout');

  // Timeout: if page_loaded hasn't fired in 12s, show error
  var loadTimeout = setTimeout(function () {
    var el = document.getElementById('moneris-loading');
    if (el && el.style.display !== 'none') {
      el.innerHTML =
        '<i class="fas fa-exclamation-triangle fa-2x" style="color:#e74c3c"></i>' +
        '<p class="mt-3" style="color:#e74c3c;font-size:.9rem">The payment form timed out. Please go back and try again.</p>' +
        '<a href="{% url 'payment_select' order.pk %}" class="btn btn-gold mt-2">Go Back</a>';
    }
  }, 12000);

  myCheckout.setCallback('page_loaded', function () {
    clearTimeout(loadTimeout);
    document.getElementById('moneris-loading').style.display = 'none';
  });

  myCheckout.setCallback('payment_receipt', function (response) {
    // Payment completed on Moneris side — verify server-side
    document.getElementById('moneris-loading').style.display = 'block';
    document.getElementById('moneris-loading').innerHTML =
      '<i class="fas fa-spinner fa-spin fa-2x text-gold"></i>' +
      '<p class="text-muted mt-3" style="font-size:.875rem">Confirming payment&hellip;</p>';

    fetch(verifyUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken,
      },
      body: JSON.stringify({ ticket: ticket }),
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      window.location.href = data.redirect;
    })
    .catch(function () {
      window.location.href = verifyUrl.replace('/moneris/verify/', '/');
    });
  });

  myCheckout.setCallback('payment_complete', function (response) {
    // Also fires on completion — same as payment_receipt for safety
    // payment_receipt is the definitive one; this is a belt-and-suspenders handler
  });

  myCheckout.setCallback('cancel_transaction', function () {
    window.location.href = "{% url 'payment_select' order.pk %}";
  });

  myCheckout.setCallback('error_event', function (response) {
    console.error('[Moneris] error_event:', response);
    window.location.href = "{% url 'payment_select' order.pk %}?moneris_error=1";
  });

  myCheckout.startCheckout(ticket);
}());
</script>
{% endblock %}
