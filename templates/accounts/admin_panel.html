<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Panel — T&TG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C96A;--dark:#080C10;--dark2:#0d1520;--dark3:#121d2e;
  --border:rgba(201,168,76,.18);--border2:rgba(255,255,255,.06);
  --text:#e0d5c0;--muted:#7a6e5f;--red:#f87171;--green:#4ade80;--blue:#60a5fa;--yellow:#fbbf24;
  color-scheme:dark;
}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--dark);color:var(--text);font-size:14px}
#root{height:100%;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.25);border-radius:4px}
</style>
</head>
<body>

<!-- Django passes serialized data here; CSRF injected below -->
<script>
window.APP_DATA = {{ data_json|safe }};
window.APP_DATA.csrf = '{{ csrf_token }}';
</script>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── helpers ──────────────────────────────────────────────────────────────────
const GOLD='#C9A84C', RED='#f87171', GREEN='#4ade80', BLUE='#60a5fa', YELLOW='#fbbf24';

function fmt(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso)return'—'; const d=new Date(iso); return d.toLocaleDateString('en-CA',{day:'numeric',month:'short',year:'numeric'}); }
function fmtTime(iso){ if(!iso)return'—'; const d=new Date(iso); return d.toLocaleString('en-CA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1).replace(/_/g,' '):s; }
function badge(label,bg,color){
  return <span style={{fontSize:'.65rem',fontWeight:700,padding:'2px 9px',borderRadius:99,background:bg,color:color,whiteSpace:'nowrap'}}>{label}</span>;
}
function statusBadge(s){
  const map={pending:[`rgba(251,191,36,.15)`,YELLOW],processing:[`rgba(96,165,250,.15)`,BLUE],accepted:[`rgba(34,197,94,.15)`,GREEN],not_accepted:[`rgba(248,113,113,.15)`,RED],shipped:[`rgba(96,165,250,.15)`,BLUE],delivered:[`rgba(34,197,94,.15)`,GREEN]};
  const [bg,c]=map[s]||[`rgba(255,255,255,.08)`,'#ccc'];
  return badge(cap(s),bg,c);
}
function payBadge(s){
  const map={unpaid:[`rgba(248,113,113,.15)`,RED],pending:[`rgba(251,191,36,.15)`,YELLOW],paid:[`rgba(34,197,94,.15)`,GREEN],failed:[`rgba(248,113,113,.15)`,RED],refunded:[`rgba(96,165,250,.15)`,BLUE]};
  const [bg,c]=map[s]||[`rgba(255,255,255,.08)`,'#ccc'];
  return badge(cap(s),bg,c);
}

async function apiFetch(url,body,csrf){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify(body)});
  return r.json();
}

// ── shared components ─────────────────────────────────────────────────────────
function Card({children,style={}}){
  return <div style={{background:'rgba(255,255,255,.03)',border:`1px solid rgba(201,168,76,.14)`,borderRadius:16,padding:20,...style}}>{children}</div>;
}
function StatTile({label,value,color=GOLD}){
  return (
    <div style={{background:'rgba(201,168,76,.06)',border:`1px solid rgba(201,168,76,.2)`,borderRadius:14,padding:18,textAlign:'center',flex:'1 1 130px'}}>
      <div style={{fontSize:'2rem',fontWeight:900,color,lineHeight:1}}>{value}</div>
      <div style={{fontSize:'.68rem',color:'#7a6e5f',marginTop:6,textTransform:'uppercase',letterSpacing:1}}>{label}</div>
    </div>
  );
}
function Btn({children,onClick,variant='gold',small=false,style={}}){
  const base={border:'none',borderRadius:10,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',...style};
  const pad=small?'6px 12px':'9px 16px';
  const fs=small?'.72rem':'.8rem';
  const vars={
    gold:{background:`rgba(201,168,76,.15)`,border:`1px solid rgba(201,168,76,.35)`,color:GOLD,padding:pad,fontSize:fs,...base},
    danger:{background:`rgba(248,113,113,.12)`,border:`1px solid rgba(248,113,113,.3)`,color:RED,padding:pad,fontSize:fs,...base},
    primary:{background:GOLD,color:'#080C10',padding:pad,fontSize:fs,...base},
    ghost:{background:'transparent',color:'#7a6e5f',padding:pad,fontSize:fs,...base},
  };
  return <button style={vars[variant]||vars.gold} onClick={onClick}>{children}</button>;
}
function Input({label,value,onChange,type='text',options=null,required=false}){
  const s={background:'rgba(255,255,255,.04)',border:'1px solid rgba(201,168,76,.2)',borderRadius:10,padding:'9px 12px',color:'#e0d5c0',width:'100%',fontSize:'.82rem',outline:'none'};
  return (
    <div style={{marginBottom:12}}>
      {label&&<div style={{fontSize:'.68rem',color:'#7a6e5f',marginBottom:5,textTransform:'uppercase',letterSpacing:.8,fontWeight:700}}>{label}{required&&<span style={{color:RED}}> *</span>}</div>}
      {options
        ? <select style={s} value={value} onChange={e=>onChange(e.target.value)}>{options.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
        : <input style={s} type={type} value={value} onChange={e=>onChange(e.target.value)}/>}
    </div>
  );
}
function Modal({title,onClose,children,footer}){
  return (
    <div style={{position:'fixed',inset:0,zIndex:9000,background:'rgba(0,0,0,.72)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#0d1520',border:`1px solid rgba(201,168,76,.2)`,borderRadius:20,width:'100%',maxWidth:480,maxHeight:'90vh',overflow:'auto',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'18px 20px',borderBottom:`1px solid rgba(201,168,76,.1)`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{color:'#fff',fontWeight:900,fontSize:'1rem'}}>{title}</span>
          <button onClick={onClose} style={{background:'none',border:'none',color:'#7a6e5f',fontSize:'1.2rem',cursor:'pointer',lineHeight:1}}>✕</button>
        </div>
        <div style={{padding:20,flex:1,overflow:'auto'}}>{children}</div>
        {footer&&<div style={{padding:'12px 20px',borderTop:`1px solid rgba(201,168,76,.1)`,display:'flex',gap:8,justifyContent:'flex-end'}}>{footer}</div>}
      </div>
    </div>
  );
}

// ── DASHBOARD TAB ─────────────────────────────────────────────────────────────
function DashboardTab({data,onTab}){
  const {stats,orders,products,notifications}=data;
  const unread=notifications.filter(n=>!n.read).length;
  const lowStock=products.filter(p=>p.stock<5&&p.active).length;
  return (
    <div style={{padding:'0 0 80px'}}>
      <div style={{padding:'20px 16px 12px',borderBottom:'1px solid rgba(255,255,255,.05)'}}>
        <div style={{fontSize:'.62rem',fontWeight:900,letterSpacing:3,color:GOLD,marginBottom:6}}>ADMIN ONLY</div>
        <h2 style={{color:'#fff',fontWeight:900,fontSize:'1.4rem',margin:0}}>Control Panel</h2>
        <p style={{color:'#7a6e5f',fontSize:'.75rem',marginTop:4}}>T&TG Trade Corp · Staff Dashboard</p>
      </div>

      <div style={{padding:16,display:'flex',flexWrap:'wrap',gap:10}}>
        <StatTile label="Total Orders"   value={stats.total_orders}/>
        <StatTile label="Pending"        value={stats.pending_orders} color={YELLOW}/>
        <StatTile label="Users"          value={stats.total_users}/>
        <StatTile label="Products"       value={stats.active_products} color={GREEN}/>
      </div>

      <div style={{padding:'0 16px',display:'flex',gap:10,marginBottom:16}}>
        <div onClick={()=>onTab('alerts')} style={{flex:1,background:unread?'rgba(201,168,76,.08)':'rgba(255,255,255,.03)',border:`1px solid ${unread?'rgba(201,168,76,.3)':'rgba(255,255,255,.06)'}`,borderRadius:14,padding:16,cursor:'pointer',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:'1.5rem'}}>🔔</span>
          <div><div style={{color:'#fff',fontWeight:700}}>{unread} unread</div><div style={{color:'#7a6e5f',fontSize:'.72rem'}}>Notifications</div></div>
        </div>
        <div onClick={()=>onTab('products')} style={{flex:1,background:lowStock?'rgba(248,113,113,.07)':'rgba(255,255,255,.03)',border:`1px solid ${lowStock?'rgba(248,113,113,.25)':'rgba(255,255,255,.06)'}`,borderRadius:14,padding:16,cursor:'pointer',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:'1.5rem'}}>📦</span>
          <div><div style={{color:'#fff',fontWeight:700}}>{lowStock} low stock</div><div style={{color:'#7a6e5f',fontSize:'.72rem'}}>Products</div></div>
        </div>
      </div>

      <div style={{padding:'0 16px 16px'}}>
        <Card>
          <div style={{fontWeight:800,color:GOLD,marginBottom:14,fontSize:'.82rem'}}>💰 Revenue Overview</div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
            <span style={{color:'#7a6e5f',fontSize:'.75rem'}}>Total Revenue</span>
            <span style={{color:'#fff',fontWeight:800}}>USD {fmt(stats.total_revenue)}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'#7a6e5f',fontSize:'.75rem'}}>Total Orders</span>
            <span style={{color:GOLD,fontWeight:700}}>{stats.total_orders}</span>
          </div>
        </Card>
      </div>

      <div style={{padding:'0 16px'}}>
        <div style={{fontWeight:800,color:'#fff',marginBottom:12,fontSize:'.85rem'}}>Recent Orders</div>
        {orders.slice(0,5).map(o=>(
          <div key={o.id} style={{display:'flex',gap:10,padding:'11px 0',borderBottom:'1px solid rgba(255,255,255,.04)',alignItems:'flex-start'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:'#e0d5c0',fontWeight:600,fontSize:'.82rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.buyer}</div>
              <div style={{color:'#7a6e5f',fontSize:'.7rem',marginTop:2}}>{o.product} · {fmtDate(o.created)}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{color:GOLD,fontWeight:700,fontSize:'.82rem'}}>{o.currency} {fmt(o.total)}</div>
              <div style={{marginTop:3}}>{statusBadge(o.status)}</div>
            </div>
          </div>
        ))}
        {orders.length>5&&<div onClick={()=>onTab('orders')} style={{textAlign:'center',color:GOLD,fontSize:'.75rem',marginTop:12,cursor:'pointer',fontWeight:700}}>View all {orders.length} orders →</div>}
      </div>
    </div>
  );
}

// ── ORDERS TAB ────────────────────────────────────────────────────────────────
function OrdersTab({orders,csrf,onOrderUpdate}){
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('all');
  const [selected,setSelected]=useState(null);
  const [saving,setSaving]=useState(false);
  const [editStatus,setEditStatus]=useState('');
  const [editPayment,setEditPayment]=useState('');

  const filtered=orders.filter(o=>{
    const q=search.toLowerCase();
    const matchQ=!q||o.buyer.toLowerCase().includes(q)||o.product.toLowerCase().includes(q)||String(o.id).includes(q);
    const matchF=filter==='all'||o.status===filter;
    return matchQ&&matchF;
  });

  function openOrder(o){setSelected(o);setEditStatus(o.status);setEditPayment(o.payment);}

  async function saveOrder(){
    if(!selected)return;
    setSaving(true);
    try{
      const res=await apiFetch(`/marketplace/api/orders/${selected.id}/update/`,{status:editStatus,payment:editPayment},csrf);
      if(res.ok!==false) onOrderUpdate(selected.id,res.status,res.payment);
    }catch(e){}
    setSaving(false);
    setSelected(null);
  }

  const chips=['all','pending','processing','accepted','shipped','delivered','not_accepted'];

  return (
    <div style={{padding:'0 0 80px'}}>
      <div style={{padding:'18px 16px 10px'}}>
        <h3 style={{color:'#fff',fontWeight:900,marginBottom:12}}>Orders</h3>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search buyer, product, ID…" style={{width:'100%',background:'rgba(255,255,255,.04)',border:'1px solid rgba(201,168,76,.2)',borderRadius:10,padding:'9px 12px',color:'#e0d5c0',fontSize:'.82rem',outline:'none',marginBottom:10}}/>
        <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:4}}>
          {chips.map(c=><button key={c} onClick={()=>setFilter(c)} style={{flexShrink:0,padding:'5px 12px',borderRadius:99,border:'none',fontWeight:700,fontSize:'.68rem',cursor:'pointer',background:filter===c?GOLD:'rgba(255,255,255,.06)',color:filter===c?'#080C10':'#7a6e5f'}}>{cap(c)}</button>)}
        </div>
      </div>

      <div style={{padding:'0 16px'}}>
        {filtered.length===0&&<p style={{color:'#7a6e5f',textAlign:'center',padding:'40px 0',fontSize:'.85rem'}}>No orders found</p>}
        {filtered.map(o=>(
          <div key={o.id} onClick={()=>openOrder(o)} style={{background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.06)',borderRadius:14,padding:'14px',marginBottom:10,cursor:'pointer',transition:'border-color .2s'}} onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(201,168,76,.3)'} onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(255,255,255,.06)'}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <div>
                <div style={{color:'#fff',fontWeight:700,fontSize:'.85rem'}}>{o.buyer}</div>
                <div style={{color:'#7a6e5f',fontSize:'.72rem',marginTop:2}}>{o.product} · {o.country} · #{o.id}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{color:GOLD,fontWeight:800,fontSize:'.85rem'}}>{o.currency} {fmt(o.total)}</div>
                <div style={{color:'#7a6e5f',fontSize:'.68rem',marginTop:2}}>{fmtDate(o.created)}</div>
              </div>
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {statusBadge(o.status)}
              {payBadge(o.payment)}
            </div>
          </div>
        ))}
      </div>

      {selected&&(
        <Modal title={`Order #${selected.id}`} onClose={()=>setSelected(null)}
          footer={<><Btn variant='ghost' onClick={()=>setSelected(null)}>Cancel</Btn><Btn variant='primary' onClick={saveOrder}>{saving?'Saving…':'Save Changes'}</Btn></>}>
          <div style={{marginBottom:14}}>
            <div style={{color:'#7a6e5f',fontSize:'.72rem',marginBottom:4}}>BUYER</div>
            <div style={{color:'#fff',fontWeight:600}}>{selected.buyer} <span style={{color:'#7a6e5f',fontSize:'.75rem'}}>({selected.buyer_email})</span></div>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{color:'#7a6e5f',fontSize:'.72rem',marginBottom:4}}>PRODUCT · QTY · COUNTRY</div>
            <div style={{color:'#e0d5c0'}}>{selected.product} × {selected.qty} → {selected.country}</div>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{color:'#7a6e5f',fontSize:'.72rem',marginBottom:4}}>TOTAL</div>
            <div style={{color:GOLD,fontWeight:800}}>{selected.currency} {fmt(selected.total)}</div>
          </div>
          <Input label="Order Status" value={editStatus} onChange={setEditStatus} options={[['pending','Pending'],['processing','Processing'],['accepted','Accepted'],['not_accepted','Not Accepted'],['shipped','Shipped'],['delivered','Delivered']]}/>
          <Input label="Payment Status" value={editPayment} onChange={setEditPayment} options={[['unpaid','Unpaid'],['pending','Payment Pending'],['paid','Paid'],['failed','Failed'],['refunded','Refunded']]}/>
        </Modal>
      )}
    </div>
  );
}

// ── PRODUCTS TAB ──────────────────────────────────────────────────────────────
function ProductsTab({products,csrf,onProductToggle,onProductSave}){
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('all');
  const [modal,setModal]=useState(null); // null | 'add' | product obj
  const [saving,setSaving]=useState(false);

  // form state
  const [form,setForm]=useState({name:'',category:'coffee',price:'',currency:'USD',stock:'',unit:'unit',active:true,image_url:''});

  function openEdit(p){
    setForm({name:p.name,category:p.category,price:String(p.price),currency:p.currency,stock:String(p.stock),unit:p.unit,active:p.active,image_url:p.image||''});
    setModal(p);
  }
  function openAdd(){
    setForm({name:'',category:'coffee',price:'',currency:'USD',stock:'',unit:'unit',active:true,image_url:''});
    setModal('add');
  }

  async function toggle(p,e){
    e.stopPropagation();
    const res=await apiFetch(`/marketplace/api/products/${p.id}/toggle/`,{},csrf);
    if(res.id) onProductToggle(p.id, res.active);
  }

  async function save(){
    setSaving(true);
    const isNew=modal==='add';
    const url=isNew?'/marketplace/api/products/new/':`/marketplace/api/products/${modal.id}/save/`;
    try{
      const res=await apiFetch(url,{...form,price:parseFloat(form.price)||0,stock:parseInt(form.stock)||0},csrf);
      if(res.ok) onProductSave(res.id, form, isNew, modal?.id);
    }catch(e){}
    setSaving(false);
    setModal(null);
  }

  const setF=k=>v=>setForm(f=>({...f,[k]:v}));

  const filtered=products.filter(p=>{
    const q=search.toLowerCase();
    const matchQ=!q||p.name.toLowerCase().includes(q);
    const matchF=filter==='all'||(filter==='inactive'?!p.active:p.category===filter);
    return matchQ&&matchF;
  });

  const lowStock=products.filter(p=>p.stock<5&&p.active).length;

  return (
    <div style={{padding:'0 0 80px'}}>
      <div style={{padding:'18px 16px 10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h3 style={{color:'#fff',fontWeight:900,margin:0}}>Products</h3>
          <Btn onClick={openAdd} small>+ Add Product</Btn>
        </div>
        {lowStock>0&&<div style={{background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.25)',borderRadius:10,padding:'10px 14px',marginBottom:12,fontSize:'.75rem',color:RED}}>⚠️ {lowStock} product{lowStock>1?'s':''} low on stock (&lt;5 units)</div>}
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products…" style={{width:'100%',background:'rgba(255,255,255,.04)',border:'1px solid rgba(201,168,76,.2)',borderRadius:10,padding:'9px 12px',color:'#e0d5c0',fontSize:'.82rem',outline:'none',marginBottom:10}}/>
        <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:4}}>
          {[['all','All'],['coffee','Coffee'],['merchandise','Merch'],['inactive','Inactive']].map(([v,l])=>(
            <button key={v} onClick={()=>setFilter(v)} style={{flexShrink:0,padding:'5px 12px',borderRadius:99,border:'none',fontWeight:700,fontSize:'.68rem',cursor:'pointer',background:filter===v?GOLD:'rgba(255,255,255,.06)',color:filter===v?'#080C10':'#7a6e5f'}}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{padding:'0 16px'}}>
        {filtered.length===0&&<p style={{color:'#7a6e5f',textAlign:'center',padding:'40px 0',fontSize:'.85rem'}}>No products found</p>}
        {filtered.map(p=>{
          const stockColor=p.stock>=10?GREEN:p.stock>=5?YELLOW:RED;
          return (
            <div key={p.id} style={{background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.06)',borderRadius:14,padding:14,marginBottom:10,display:'flex',gap:12,alignItems:'center'}} >
              {p.image
                ? <img src={p.image} alt={p.name} style={{width:52,height:52,borderRadius:10,objectFit:'cover',flexShrink:0}}/>
                : <div style={{width:52,height:52,borderRadius:10,background:'rgba(201,168,76,.08)',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(201,168,76,.3)',fontSize:'1.4rem'}}>☕</div>
              }
              <div style={{flex:1,minWidth:0}}>
                <div style={{color:'#fff',fontWeight:700,fontSize:'.85rem'}}>{p.name}</div>
                <div style={{color:'#7a6e5f',fontSize:'.72rem',marginTop:2}}>{p.currency} {fmt(p.price)}/{p.unit} · {cap(p.category)}</div>
                <div style={{display:'flex',alignItems:'center',gap:8,marginTop:5}}>
                  <div style={{flex:1,height:4,borderRadius:2,background:'rgba(255,255,255,.08)',overflow:'hidden'}}>
                    <div style={{height:'100%',borderRadius:2,background:stockColor,width:`${Math.min(100,(p.stock/20)*100)}%`,transition:'width .3s'}}/>
                  </div>
                  <span style={{color:stockColor,fontSize:'.68rem',fontWeight:700,whiteSpace:'nowrap'}}>{p.stock} left</span>
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
                <Btn small onClick={()=>openEdit(p)}>Edit</Btn>
                <Btn small variant={p.active?'danger':'gold'} onClick={e=>toggle(p,e)}>{p.active?'Deactivate':'Activate'}</Btn>
              </div>
            </div>
          );
        })}
      </div>

      {modal&&(
        <Modal title={modal==='add'?'Add Product':`Edit: ${modal.name}`} onClose={()=>setModal(null)}
          footer={<><Btn variant='ghost' onClick={()=>setModal(null)}>Cancel</Btn><Btn variant='primary' onClick={save}>{saving?'Saving…':'Save'}</Btn></>}>
          <Input label="Product Name" value={form.name} onChange={setF('name')} required/>
          <Input label="Category" value={form.category} onChange={setF('category')} options={[['coffee','Coffee'],['merchandise','Merchandise & Gifts']]}/>
          <div style={{display:'flex',gap:10}}>
            <div style={{flex:1}}><Input label="Price" value={form.price} onChange={setF('price')} type="number"/></div>
            <div style={{flex:1}}><Input label="Currency" value={form.currency} onChange={setF('currency')} options={[['USD','USD'],['CAD','CAD'],['EUR','EUR'],['KES','KES'],['UGX','UGX'],['JPY','JPY']]}/></div>
          </div>
          <div style={{display:'flex',gap:10}}>
            <div style={{flex:1}}><Input label="Stock Qty" value={form.stock} onChange={setF('stock')} type="number"/></div>
            <div style={{flex:1}}><Input label="Unit" value={form.unit} onChange={setF('unit')}/></div>
          </div>
          <Input label="Image URL (optional)" value={form.image_url} onChange={setF('image_url')}/>
          <div style={{display:'flex',alignItems:'center',gap:10,marginTop:4}}>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
              <div onClick={()=>setF('active')(!form.active)} style={{width:36,height:20,borderRadius:99,background:form.active?GOLD:'rgba(255,255,255,.1)',position:'relative',transition:'background .2s',cursor:'pointer'}}>
                <div style={{position:'absolute',top:2,left:form.active?18:2,width:16,height:16,borderRadius:'50%',background:'#fff',transition:'left .2s'}}/>
              </div>
              <span style={{color:'#7a6e5f',fontSize:'.78rem'}}>Active</span>
            </label>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── ANALYTICS TAB ─────────────────────────────────────────────────────────────
function AnalyticsTab({orders,products,users}){
  const byStatus={};
  orders.forEach(o=>{byStatus[o.status]=(byStatus[o.status]||0)+1;});
  const byCountry={};
  users.forEach(u=>{const c=u.country||'Unknown';byCountry[c]=(byCountry[c]||0)+1;});
  const topCountries=Object.entries(byCountry).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const totalRev=orders.reduce((s,o)=>s+o.total,0);
  const paidRev=orders.filter(o=>o.payment==='paid').reduce((s,o)=>s+o.total,0);

  return (
    <div style={{padding:'0 0 80px'}}>
      <div style={{padding:'18px 16px 10px'}}>
        <h3 style={{color:'#fff',fontWeight:900}}>Analytics</h3>
      </div>
      <div style={{padding:'0 16px',display:'flex',flexWrap:'wrap',gap:10,marginBottom:16}}>
        <StatTile label="Total Revenue" value={`$${Math.round(totalRev).toLocaleString()}`}/>
        <StatTile label="Paid Revenue"  value={`$${Math.round(paidRev).toLocaleString()}`} color={GREEN}/>
      </div>

      <div style={{padding:'0 16px',marginBottom:16}}>
        <Card>
          <div style={{fontWeight:800,color:GOLD,marginBottom:14,fontSize:'.82rem'}}>Orders by Status</div>
          {Object.entries(byStatus).map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <span style={{color:'#e0d5c0',fontSize:'.82rem'}}>{statusBadge(k)}</span>
              <div style={{display:'flex',alignItems:'center',gap:10,flex:1,marginLeft:12}}>
                <div style={{flex:1,height:6,borderRadius:3,background:'rgba(255,255,255,.06)',overflow:'hidden'}}>
                  <div style={{height:'100%',borderRadius:3,background:GOLD,width:`${(v/orders.length)*100}%`}}/>
                </div>
                <span style={{color:'#fff',fontWeight:700,fontSize:'.82rem',minWidth:24,textAlign:'right'}}>{v}</span>
              </div>
            </div>
          ))}
        </Card>
      </div>

      <div style={{padding:'0 16px',marginBottom:16}}>
        <Card>
          <div style={{fontWeight:800,color:GOLD,marginBottom:14,fontSize:'.82rem'}}>Users by Country</div>
          {topCountries.map(([c,n])=>(
            <div key={c} style={{display:'flex',justifyContent:'space-between',marginBottom:10,paddingBottom:10,borderBottom:'1px solid rgba(255,255,255,.04)'}}>
              <span style={{color:'#e0d5c0',fontSize:'.82rem'}}>{c||'Not specified'}</span>
              <span style={{color:GOLD,fontWeight:700}}>{n}</span>
            </div>
          ))}
        </Card>
      </div>

      <div style={{padding:'0 16px'}}>
        <Card>
          <div style={{fontWeight:800,color:GOLD,marginBottom:14,fontSize:'.82rem'}}>Top Products (by name)</div>
          {products.slice(0,6).map(p=>(
            <div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,paddingBottom:10,borderBottom:'1px solid rgba(255,255,255,.04)'}}>
              <div>
                <div style={{color:'#e0d5c0',fontSize:'.82rem',fontWeight:600}}>{p.name}</div>
                <div style={{color:'#7a6e5f',fontSize:'.7rem'}}>{p.currency} {fmt(p.price)}/{p.unit}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{color:p.active?GREEN:RED,fontSize:'.7rem',fontWeight:700}}>{p.active?'Active':'Inactive'}</div>
                <div style={{color:'#7a6e5f',fontSize:'.68rem'}}>{p.stock} in stock</div>
              </div>
            </div>
          ))}
        </Card>
      </div>
    </div>
  );
}

// ── ALERTS TAB ────────────────────────────────────────────────────────────────
function AlertsTab({notifications}){
  const [tab,setTab]=useState('all');
  const items=tab==='unread'?notifications.filter(n=>!n.read):notifications;
  return (
    <div style={{padding:'0 0 80px'}}>
      <div style={{padding:'18px 16px 10px'}}>
        <h3 style={{color:'#fff',fontWeight:900,marginBottom:12}}>Notifications</h3>
        <div style={{display:'flex',gap:6}}>
          {[['all','All'],['unread','Unread']].map(([v,l])=>(
            <button key={v} onClick={()=>setTab(v)} style={{padding:'5px 14px',borderRadius:99,border:'none',fontWeight:700,fontSize:'.72rem',cursor:'pointer',background:tab===v?GOLD:'rgba(255,255,255,.06)',color:tab===v?'#080C10':'#7a6e5f'}}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{padding:'0 16px'}}>
        {items.length===0&&<p style={{color:'#7a6e5f',textAlign:'center',padding:'40px 0',fontSize:'.85rem'}}>No notifications</p>}
        {items.map(n=>(
          <div key={n.id} style={{display:'flex',gap:12,padding:'14px 0',borderBottom:'1px solid rgba(255,255,255,.04)'}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:n.read?'rgba(201,168,76,.3)':GOLD,marginTop:5,flexShrink:0}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:n.read?'#7a6e5f':'#fff',fontWeight:n.read?400:700,fontSize:'.82rem'}}>{n.title}</div>
              <div style={{color:'#7a6e5f',fontSize:'.72rem',marginTop:3}}>{n.message}</div>
              <div style={{color:'rgba(201,168,76,.5)',fontSize:'.68rem',marginTop:3}}>{fmtTime(n.created)}</div>
            </div>
            {n.link&&<a href={n.link} style={{color:GOLD,fontSize:'.72rem',textDecoration:'none',flexShrink:0}}>View</a>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── USERS TAB ─────────────────────────────────────────────────────────────────
function UsersTab({users}){
  const [search,setSearch]=useState('');
  const filtered=users.filter(u=>{
    const q=search.toLowerCase();
    return !q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||(u.country||'').toLowerCase().includes(q);
  });
  return (
    <div style={{padding:'0 0 80px'}}>
      <div style={{padding:'18px 16px 10px'}}>
        <h3 style={{color:'#fff',fontWeight:900,marginBottom:12}}>Users <span style={{color:'#7a6e5f',fontWeight:400,fontSize:'.85rem'}}>({users.length})</span></h3>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, email, country…" style={{width:'100%',background:'rgba(255,255,255,.04)',border:'1px solid rgba(201,168,76,.2)',borderRadius:10,padding:'9px 12px',color:'#e0d5c0',fontSize:'.82rem',outline:'none'}}/>
      </div>
      <div style={{padding:'0 16px'}}>
        {filtered.length===0&&<p style={{color:'#7a6e5f',textAlign:'center',padding:'40px 0',fontSize:'.85rem'}}>No users found</p>}
        {filtered.map(u=>(
          <div key={u.id} style={{display:'flex',gap:12,padding:'12px 0',borderBottom:'1px solid rgba(255,255,255,.04)',alignItems:'center'}}>
            <div style={{width:36,height:36,borderRadius:'50%',background:`rgba(201,168,76,.12)`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:GOLD,fontWeight:700,fontSize:'.85rem'}}>{u.name.charAt(0).toUpperCase()}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:'#fff',fontWeight:600,fontSize:'.82rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.name}</div>
              <div style={{color:'#7a6e5f',fontSize:'.7rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.email}</div>
              <div style={{color:'rgba(201,168,76,.6)',fontSize:'.68rem',marginTop:2}}>{u.country||'—'} · joined {fmtDate(u.joined)}</div>
            </div>
            {u.staff&&badge('Staff','rgba(201,168,76,.15)',GOLD)}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── BOTTOM TAB BAR ────────────────────────────────────────────────────────────
const TABS=[
  {id:'dashboard',label:'Home',   icon:'⊞'},
  {id:'orders',   label:'Orders', icon:'📋'},
  {id:'products', label:'Stock',  icon:'📦'},
  {id:'analytics',label:'Stats',  icon:'📊'},
  {id:'alerts',   label:'Alerts', icon:'🔔'},
  {id:'users',    label:'Users',  icon:'👥'},
];

function BottomBar({active,onTab,unread}){
  return (
    <nav style={{position:'fixed',bottom:0,left:0,right:0,background:'rgba(8,12,16,.97)',borderTop:'1px solid rgba(201,168,76,.15)',display:'flex',zIndex:100,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
      {TABS.map(t=>{
        const isActive=t.id===active;
        const showDot=t.id==='alerts'&&unread>0;
        return (
          <button key={t.id} onClick={()=>onTab(t.id)} style={{flex:1,padding:'10px 4px 8px',background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,position:'relative'}}>
            <span style={{fontSize:'1.1rem',lineHeight:1}}>{t.icon}</span>
            <span style={{fontSize:'.58rem',fontWeight:700,color:isActive?GOLD:'#7a6e5f',letterSpacing:.3}}>{t.label}</span>
            {isActive&&<div style={{position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',width:24,height:2,borderRadius:99,background:GOLD}}/>}
            {showDot&&<div style={{position:'absolute',top:8,right:'18%',width:7,height:7,borderRadius:'50%',background:RED}}/>}
          </button>
        );
      })}
    </nav>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────────
function App(){
  const raw=window.APP_DATA;
  const csrf=raw.csrf;

  const [tab,setTab]=useState('dashboard');
  const [products,setProducts]=useState(raw.products||[]);
  const [orders,setOrders]=useState(raw.orders||[]);

  const notifications=raw.notifications||[];
  const users=raw.users||[];
  const stats=raw.stats||{};
  const unread=notifications.filter(n=>!n.read).length;

  function handleProductToggle(id,active){
    setProducts(ps=>ps.map(p=>p.id===id?{...p,active}:p));
  }
  function handleProductSave(id,form,isNew,oldId){
    if(isNew){
      setProducts(ps=>[...ps,{id,name:form.name,category:form.category,price:parseFloat(form.price)||0,currency:form.currency,stock:parseInt(form.stock)||0,unit:form.unit,active:form.active,image:form.image_url}]);
    } else {
      setProducts(ps=>ps.map(p=>p.id===oldId?{...p,name:form.name,category:form.category,price:parseFloat(form.price)||0,currency:form.currency,stock:parseInt(form.stock)||0,unit:form.unit,active:form.active,image:form.image_url}:p));
    }
  }
  function handleOrderUpdate(id,status,payment){
    setOrders(os=>os.map(o=>o.id===id?{...o,status,payment}:o));
  }

  return (
    <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
      <div style={{flex:1,overflowY:'auto',paddingBottom:60}}>
        {tab==='dashboard'  &&<DashboardTab  data={{stats,orders,products,notifications}} onTab={setTab}/>}
        {tab==='orders'     &&<OrdersTab     orders={orders} csrf={csrf} onOrderUpdate={handleOrderUpdate}/>}
        {tab==='products'   &&<ProductsTab   products={products} csrf={csrf} onProductToggle={handleProductToggle} onProductSave={handleProductSave}/>}
        {tab==='analytics'  &&<AnalyticsTab  orders={orders} products={products} users={users}/>}
        {tab==='alerts'     &&<AlertsTab     notifications={notifications}/>}
        {tab==='users'      &&<UsersTab      users={users}/>}
      </div>
      <BottomBar active={tab} onTab={setTab} unread={unread}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
